<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cotizaciones Tikal</title>
<meta name="theme-color" content="#2c6a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
/* Layout: una sola columna para el pulgar; el total y "Guardar PDF" siempre visibles abajo. */
:root {
  --bg: #f3f6f0; --surface: #ffffff; --fg: #1d2a20; --muted: #586a5c; --line: #cfdacb;
  --band: #e2efda; --accent: #2c6a3c; --on-accent: #ffffff; --danger: #a62f22; --ok: #24683a;
  --paper: #ffffff; --paper-ink: #111111; --paper-band: #e2efda; --paper-zebra: #d9d9d9;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c16; --surface: #1d2820; --fg: #e8efe6; --muted: #a2b3a5; --line: #36453a;
    --band: #243528; --accent: #7fce95; --on-accent: #10261a; --danger: #ff9d8f; --ok: #8fd8a4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c16; --surface: #1d2820; --fg: #e8efe6; --muted: #a2b3a5; --line: #36453a;
  --band: #243528; --accent: #7fce95; --on-accent: #10261a; --danger: #ff9d8f; --ok: #8fd8a4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.4 var(--body); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 132px;
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; align-items: center; gap: 12px; }
.logo { width: 76px; height: auto; background: #ffffff; border-radius: 6px; padding: 3px; flex: none; }
.head-text { min-width: 0; flex: 1; }
h1 { font: 700 30px/1.05 var(--display); margin: 0; text-wrap: balance; }
.fecha { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
.fecha strong { color: var(--fg); font-weight: 600; white-space: nowrap; }
h2 {
  font: 600 13px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label { font-size: 14px; font-weight: 500; color: var(--muted); }
input, textarea, select {
  width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px;
  font: 400 16px/1.3 var(--body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
textarea { min-height: 72px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
}
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.items { display: flex; flex-direction: column; }
.item {
  display: flex; flex-direction: column; gap: 8px;
  padding-block: 14px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; padding-top: 0; }
.tres { display: grid; grid-template-columns: 1fr 1.25fr 1.1fr; gap: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sub-val { font-weight: 600; font-variant-numeric: tabular-nums; }
button { font: 600 16px/1.2 var(--body); cursor: pointer; border-radius: 8px; }
.quitar {
  background: none; border: 0; color: var(--danger); min-height: 40px; padding: 0 4px;
  font-size: 15px; font-weight: 500;
}
.agregar {
  min-height: 48px; background: var(--surface); color: var(--accent);
  border: 1px dashed var(--accent); width: 100%;
}
.nueva {
  background: none; color: var(--accent); border: 1px solid var(--accent);
  min-height: 42px; padding: 0 12px; font-size: 15px; flex: none;
}
.nueva.seguro { background: var(--danger); color: var(--bg); border-color: var(--danger); }

/* Hoja de vista previa: siempre blanca, igual que el PDF */
.hoja-scroll { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.hoja-cont { container-type: inline-size; }
.hoja {
  background: var(--paper); color: var(--paper-ink);
  aspect-ratio: 8.5 / 11; padding: 7% 8.3% 3%;
  font: 400 1.75cqw/1.42 var(--body);
  display: flex; flex-direction: column;
}
.h-top { display: grid; grid-template-columns: 74% 26%; }
.h-band { background: var(--paper-band); text-align: center; padding: 3.5% 2% 1.2%; }
.h-band b { display: block; margin-top: .9em; }
.h-top img { width: 100%; align-self: center; display: block; }
.h-datos { display: grid; grid-template-columns: 19.5% 1fr; margin-top: .4em; }
.h-datos b:nth-of-type(2) { margin-top: 1.2em; }
.h-datos span:nth-of-type(2) { margin-top: 1.2em; }
.h-titulo { font-weight: 700; text-align: center; margin: 1.4em 12% .1em 0; }
.h-tabla { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.h-tabla th { text-align: left; border-block: .13em solid var(--paper-ink); font-weight: 700; padding: .05em .2em; }
.h-tabla td { padding: .05em .2em; vertical-align: top; }
.h-tabla tbody tr:nth-child(odd) td { background: var(--paper-zebra); }
.h-tabla tfoot td { border-block: .13em solid var(--paper-ink); font-weight: 700; }
.der { text-align: right !important; }
.h-obs { margin-top: 3em; white-space: pre-line; }
.h-gracias { margin-top: auto; text-align: center; font-weight: 600; font-style: italic; }

.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.barra-in { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.barra-fila { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.total-l { font-size: 13px; color: var(--muted); display: block; }
.total-v { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.guardar {
  background: var(--accent); color: var(--on-accent); border: 0;
  min-height: 52px; padding: 0 22px; font-size: 17px; flex: 0 1 auto;
}
.guardar:disabled { opacity: .6; cursor: default; }
.estado { font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.estado.error { color: var(--danger); }
.estado.bien { color: var(--ok); }
</style>
</head>

  luis: { logo: LOGO_TIKAL, lineas: ["DISTRIBUIDORA TIKAL", "NIT: 2114410 - Luis Elias Pú", "MERCADO CENTRAL, TERMINAL DE BUSES", "Santa Elena, Flores, Petén", "Tel. 42972129"] },

};
let tienda = "luis";
let EMPRESA = TIENDAS.luis.lineas;
let LOGO = TIENDAS.luis.logo;
const GRACIAS = "¡GRACIAS POR SU PREFERENCIA!";
const OBS_BASE = "Oferta válida por 10 días\nNo es un documento contable";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const filaVacia = () => ({ cant: "", um: "UNIDAD", desc: "", precio: "" });
const enBlanco = () => ({ cliente: "", nit: "", direccion: "", obs: OBS_BASE, items: [filaVacia()] });

const $ = id => document.getElementById(id);
let q = enBlanco();

const num = s => { const n = parseFloat(String(s == null ? "" : s).replace(/[,\sQq]/g, "")); return isFinite(n) ? n : 0; };
const dinero = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cantTxt = s => { const n = num(s); return Number.isInteger(n) ? String(n) : n.toLocaleString("en-US", { maximumFractionDigits: 2 }); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hoy(d = new Date()) { return String(d.getDate()).padStart(2, "0") + " " + MESES[d.getMonth()] + ", " + d.getFullYear(); }
const filasLlenas = c => c.items.filter(i => i.desc.trim() || i.cant.trim() || i.precio.trim());
const totalDe = c => filasLlenas(c).reduce((t, i) => t + num(i.cant) * num(i.precio), 0);
function nombreArchivo(cliente) {
  const limpio = cliente.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9 ._-]/g, "").replace(/\s+/g, "_");
  return "cotizacion_" + (limpio || "cliente") + ".pdf";
}

/* ---------- PDF: mismas medidas de la cotización de Excel (carta, en mm) ---------- */
function crearPdf(c) {
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
  const IZQ = 18, DER = 187, X_DESC = 53.2, X_Q1 = 135.4, X_P = 158.6, X_Q2 = 162.8, X_T = 184.8;
  const TAM = 10.5, LIMITE = 256;
  const fuente = (estilo) => { doc.setFont("helvetica", estilo); doc.setFontSize(TAM); };

  doc.setFillColor(226, 239, 218);
  doc.rect(IZQ, 19, 124.6, 36, "F");
  doc.addImage(LOGO, "JPEG", 142.90, 22.06, 43.80, 29.87);
  fuente("normal");
  const CX = 80.3;
  EMPRESA.forEach((t, i) => doc.text(t, CX, 25.4 + i * 5.1, { align: "center" }));
  fuente("bold");
  doc.text("COTIZACIÓN", CX, 53.3, { align: "center" });

  doc.text("FECHA", 18.7, 58.8);
  fuente("normal");
  doc.text(hoy(), X_DESC, 59);

  let y = 69;
  [["CLIENTE:", c.cliente], ["NIT:", c.nit], ["DIRECCIÓN:", c.direccion]].forEach(([e, v]) => {
    fuente("bold"); doc.text(e, 18.7, y);
    fuente("normal");
    const ls = doc.splitTextToSize(v.trim(), DER - X_DESC);
    doc.text(ls, X_DESC, y);
    y += 5.2 * Math.max(1, ls.length);
  });

  y += 5.4;
  fuente("bold");
  doc.text("PRODUCTOS", 92.4, y, { align: "center" });
  y += 1.2;

  const encabezado = () => {
    doc.setLineWidth(0.4); doc.setDrawColor(0);
    doc.line(IZQ, y, DER, y);
    fuente("bold");
    doc.text("Cantidad", 18.7, y + 3.9);
    doc.text("U. M.", 35.8, y + 3.9);
    doc.text("Descripción", X_DESC, y + 3.9);
    doc.text("Precio Unidad", X_Q1, y + 3.9);
    doc.text("Precio total", X_Q2, y + 3.9);
    y += 5.1;
    doc.line(IZQ, y, DER, y);
  };
  encabezado();

  fuente("normal");
  filasLlenas(c).forEach((it, i) => {
    const ls = doc.splitTextToSize(it.desc.trim(), X_Q1 - X_DESC - 2);
    const alto = Math.max(5.1, ls.length * 4.5 + 0.6);
    if (y + alto + 5.1 > LIMITE) { doc.addPage(); y = 20; encabezado(); fuente("normal"); }
    if (i % 2 === 0) { doc.setFillColor(217, 217, 217); doc.rect(IZQ, y, DER - IZQ, alto, "F"); }
    const b = y + 3.8;
    doc.text(cantTxt(it.cant), 34.4, b, { align: "right" });
    doc.text(it.um.trim(), 35.8, b);
    doc.text(ls, X_DESC, b);
    doc.text("Q", X_Q1, b);
    doc.text(dinero(num(it.precio)), X_P, b, { align: "right" });
    doc.text("Q", X_Q2, b);
    doc.text(dinero(num(it.cant) * num(it.precio)), X_T, b, { align: "right" });
    y += alto;
  });

  doc.setLineWidth(0.4);
  doc.line(IZQ, y, DER, y);
  fuente("bold");
  doc.text("Total", 18.7, y + 3.9);
  doc.text("Q", X_Q2, y + 3.9);
  doc.text(dinero(totalDe(c)), X_T, y + 3.9, { align: "right" });
  y += 5.1;
  doc.line(IZQ, y, DER, y);

  const obs = c.obs.trim();
  if (obs) {
    const ls = doc.splitTextToSize(obs, DER - IZQ);
    if (y + 13 + 5.2 + ls.length * 5.2 > LIMITE) { doc.addPage(); y = 8; }
    y += 13;
    fuente("bold"); doc.text("Observaciones:", 18.7, y);
    fuente("normal");
    ls.forEach(l => { y += 5.2; doc.text(l, 18.7, y); });
  }

  // Pie de página en todas las hojas
  const paginas = doc.getNumberOfPages();
  for (let p = 1; p <= paginas; p++) {
    doc.setPage(p);
    doc.setFont("helvetica", "bolditalic"); doc.setFontSize(TAM);
    doc.text(GRACIAS, 107.95, 268, { align: "center" });
  }
  return doc;
}

/* ---------- Pantalla ---------- */
function pintarItems() {
  const cont = $("items");
  cont.textContent = "";
  q.items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML =
      '<div class="field"><label for="desc-' + i + '">Descripción</label>' +
      '<input id="desc-' + i + '" autocomplete="off" data-c="desc" placeholder="Ej.: Cubeta plástica 5 galones" value="' + esc(it.desc) + '"></div>' +
      '<div class="tres">' +
      '<div class="field"><label for="cant-' + i + '">Cantidad</label><input id="cant-' + i + '" class="num" inputmode="decimal" autocomplete="off" data-c="cant" value="' + esc(it.cant) + '"></div>' +
      '<div class="field"><label for="um-' + i + '">U. M.</label><select id="um-' + i + '" data-c="um">' + ["UNIDAD", "DOCENA", "FARDO"].map(u => '<option' + (it.um === u ? ' selected' : '') + '>' + u + '</option>').join("") + '</select></div>' +
      '<div class="field"><label for="precio-' + i + '">Precio Q</label><input id="precio-' + i + '" class="num" inputmode="decimal" autocomplete="off" data-c="precio" value="' + esc(it.precio) + '"></div>' +
      '</div>' +
      '<div class="sub"><button type="button" class="quitar" data-quitar="' + i + '">Quitar</button>' +
      '<span class="sub-val" id="sub-' + i + '"></span></div>';
    d.addEventListener("input", e => {
      const campo = e.target.dataset.c;
      if (!campo) return;
      it[campo] = e.target.value;
      cambio();
    });
    cont.appendChild(d);
  });
}

function pintarHoja() {
  const filas = filasLlenas(q).map(i =>
    '<tr><td class="der">' + esc(cantTxt(i.cant)) + '</td><td>' + esc(i.um) + '</td><td>' + esc(i.desc) + '</td>' +
    '<td class="der">Q ' + dinero(num(i.precio)) + '</td><td class="der">Q ' + dinero(num(i.cant) * num(i.precio)) + '</td></tr>').join("");
  $("hoja").innerHTML =
    '<div class="h-top"><div class="h-band">' + EMPRESA.map(esc).join("<br>") + '<b>COTIZACIÓN</b></div><img src="' + LOGO + '" alt=""></div>' +
    '<div class="h-datos"><b>FECHA</b><span>' + hoy() + '</span>' +
    '<b>CLIENTE:</b><span>' + esc(q.cliente) + '</span><b>NIT:</b><span>' + esc(q.nit) + '</span><b>DIRECCIÓN:</b><span>' + esc(q.direccion) + '</span></div>' +
    '<div class="h-titulo">PRODUCTOS</div>' +
    '<table class="h-tabla"><thead><tr><th>Cantidad</th><th>U. M.</th><th>Descripción</th><th class="der">Precio Unidad</th><th class="der">Precio total</th></tr></thead>' +
    '<tbody>' + filas + '</tbody><tfoot><tr><td colspan="4">Total</td><td class="der">Q ' + dinero(totalDe(q)) + '</td></tr></tfoot></table>' +
    (q.obs.trim() ? '<div class="h-obs"><b>Observaciones:</b><br>' + esc(q.obs.trim()) + '</div>' : '') +
    '<div class="h-gracias">' + GRACIAS + '</div>';
}

function refrescar() {
  $("fecha").textContent = hoy();
  q.items.forEach((it, i) => {
    const el = $("sub-" + i);
    if (el) el.textContent = "Q " + dinero(num(it.cant) * num(it.precio));
  });
  $("total").textContent = "Q " + dinero(totalDe(q));
  pintarHoja();
}

function cambio() {
  avisar("");
  refrescar();
}

function pintarTodo() {
  $("cliente").value = q.cliente; $("nit").value = q.nit; $("direccion").value = q.direccion; $("obs").value = q.obs;
  pintarItems(); refrescar();
}

function avisar(texto, tipo) {
  const e = $("estado");
  e.textContent = texto;
  e.className = "estado" + (tipo ? " " + tipo : "");
  e.hidden = !texto;
}

["cliente", "nit", "direccion", "obs"].forEach(k => {
  $(k).addEventListener("input", e => {
    q[k] = e.target.value;
    cambio();
  });
});

$("agregar").addEventListener("click", () => {
  q.items.push(filaVacia());
  pintarItems(); cambio();
  $("desc-" + (q.items.length - 1)).focus();
});

$("items").addEventListener("click", e => {
  const i = e.target.dataset.quitar;
  if (i === undefined) return;
  q.items.splice(Number(i), 1);
  if (!q.items.length) q.items.push(filaVacia());
  pintarItems(); cambio();
});

let armado = null;
$("nueva").addEventListener("click", () => {
  const b = $("nueva");
  if (!armado) {
    b.textContent = "¿Borrar todo?"; b.classList.add("seguro");
    armado = setTimeout(() => { armado = null; b.textContent = "Limpiar"; b.classList.remove("seguro"); }, 3000);
    return;
  }
  clearTimeout(armado); armado = null;
  b.textContent = "Limpiar"; b.classList.remove("seguro");
  q = enBlanco();
  avisar("");
  pintarTodo();
  $("cliente").focus();
});

function revisar() {
  if (!q.cliente.trim()) return "Escribe el nombre del cliente. El PDF se guarda con ese nombre.";
  const filas = filasLlenas(q);
  if (!filas.length) return "Agrega al menos un producto.";
  for (const it of filas) {
    const n = it.desc.trim() || "un producto";
    if (!it.desc.trim()) return "Falta la descripción de un producto.";
    if (num(it.cant) <= 0) return "Falta la cantidad de: " + n + ".";
    if (!it.precio.trim()) return "Falta el precio de: " + n + ".";
  }
  return "";
}

$("guardar").addEventListener("click", async () => {
  const problema = revisar();
  if (problema) { avisar(problema, "error"); return; }
  if (!window.jspdf) { avisar("No se pudo preparar el PDF. Conéctate a internet y abre la app otra vez.", "error"); return; }
  const boton = $("guardar");
  boton.disabled = true;
  try {
    const nombre = nombreArchivo(q.cliente);
    const url = URL.createObjectURL(crearPdf(q).output("blob"));
    const enlace = document.createElement("a");
    enlace.href = url;
    enlace.download = nombre;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    avisar("Listo: " + nombre, "bien");
  } catch (e) {
    avisar("No se pudo crear el PDF. Cierra la app, ábrela otra vez e inténtalo de nuevo.", "error");
  } finally {
    boton.disabled = false;
  }
});

$("tienda").value = tienda;
$("tienda").addEventListener("change", e => {
  tienda = TIENDAS[e.target.value] ? e.target.value : "luis";
  EMPRESA = TIENDAS[tienda].lineas;
  LOGO = TIENDAS[tienda].logo;
  avisar("");
  refrescar();
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });
pintarTodo();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
